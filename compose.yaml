services:

  app:
    build:
      context: .
      dockerfile: docker/laravel/DockerFile

    container_name: doctor-app

    restart: unless-stopped

    working_dir: /var/www/html

    volumes:
      - .:/var/www/html

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

    networks:
      - doctor-network


  nginx:
    image: nginx:alpine

    container_name: doctor-nginx

    restart: unless-stopped

    ports:
      - "8000:80"

    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app

    networks:
      - doctor-network


  postgres:
    image: postgres:17

    container_name: doctor-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: doctor
      POSTGRES_USER: doctor
      POSTGRES_PASSWORD: doctor

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctor -d doctor"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - doctor-network


  redis:
    image: redis:7-alpine

    container_name: doctor-redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

    networks:
      - doctor-network


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0

    container_name: doctor-elasticsearch

    restart: unless-stopped

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - doctor-network

  scheduler:
    build:
        context: .
        dockerfile: docker/laravel/DockerFile
    container_name: doctor-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    volumes:
        - .:/var/www/html
    depends_on:
        postgres:
            condition: service_healthy
        redis:
            condition: service_healthy
    networks:
        - doctor-network

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:


networks:
  doctor-network:
    driver: bridge
